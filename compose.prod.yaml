services:
  api:
    build:
      context: ./back-end
      target: prod
    env_file:
      - ./back-end/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:3001
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/data/database.sqlite
    ports:
      - "3001:80"
    volumes:
      - api_data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@file_get_contents('http://127.0.0.1/health') === false ? 1 : 0);"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./front-end
      target: prod
      args:
        VITE_API_URL: http://localhost:3001/api/v1
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  api_data:
