services:
  api:
    build:
      context: ./back-end
      target: prod
    env_file:
      - ./back-end/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://pedro.frameworksweb.com.br
      CORS_ALLOWED_ORIGINS: https://pedro.frameworksweb.com.br
      DB_CONNECTION: pgsql
    ports: []
    volumes:
      - api_data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@file_get_contents('http://127.0.0.1/api/v1/health') === false ? 1 : 0);"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-network

  web:
    build:
      context: ./front-end
      target: prod
      args:
        VITE_API_URL: /api/v1
    ports:
      - "8081:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

volumes:
  api_data:

networks:
  app-network:
    driver: bridge
