services:
  api:
    build:
      context: ./back-end
      target: dev
    env_file:
      - ./back-end/.env
    ports:
      - "8000:8000"
    volumes:
      - ./back-end:/app
      - laravel_vendor:/app/vendor
    networks:
      - app-network

  web:
    build:
      context: ./front-end
      target: dev
    depends_on:
      - api
    environment:
      VITE_API_URL: /api/v1
      VITE_API_PROXY_TARGET: http://api:8000
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    ports:
      - "3003:3001"
    volumes:
      - ./front-end:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - app-network

volumes:
  laravel_vendor:
  frontend_node_modules:

networks:
  app-network:
    driver: bridge
